<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Security Patrol</title>

  <style>
    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#ffffff;
    }
    body{
      visibility:hidden;
    }
  </style>

  <script>
  (() => {
    // v1.9.8.2 - Invisible Permanent Checkpoint Redirect
    // Future Apps Script migration:
    // change only WEB_APP_URL and commit.
    const WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbzB-0jZIi8drqsNJTSl-U7SCLrpdvEqQdhk-vN-V7TFDXpRan64auSyafezQV5xxeSKtA/exec';

    const TOTAL_CHECKPOINTS = 22;

    const params =
      new URLSearchParams(window.location.search);

    const point =
      Number(params.get('point'));

    if (
      Number.isInteger(point) &&
      point >= 1 &&
      point <= TOTAL_CHECKPOINTS
    ) {
      const target =
        WEB_APP_URL +
        '?point=' +
        encodeURIComponent(String(point));

      window.location.replace(target);
      return;
    }

    // Only invalid manually entered URLs reveal an error.
    document.addEventListener('DOMContentLoaded', () => {
      document.body.style.visibility = 'visible';
      document.body.textContent =
        'Invalid security patrol checkpoint.';
      document.body.style.padding = '24px';
      document.body.style.fontFamily =
        '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
      document.body.style.color = '#b42318';
      document.body.style.fontWeight = '700';
    });
  })();
  </script>
</head>
<body></body>
</html>
