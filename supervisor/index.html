<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Security Patrol Supervisor</title>
  <script>
    (function () {
      'use strict';

      var APP_URL = 'https://script.google.com/macros/s/AKfycbzB-0jZIi8drqsNJTSl-U7SCLrpdvEqQdhk-vN-V7TFDXpRan64auSyafezQV5xxeSKtA/exec';
      var destination = new URL(APP_URL);
      var incoming = new URLSearchParams(window.location.search || '');

      // The Apps Script web app serves Admin.html only when admin=1.
      destination.searchParams.set('admin', '1');

      // Preserve future Supervisor/Guest/reset parameters without allowing
      // the required admin route flag to be overwritten.
      incoming.forEach(function (value, key) {
        if (String(key).toLowerCase() !== 'admin') {
          destination.searchParams.append(key, value);
        }
      });

      destination.hash = window.location.hash || '';
      window.location.replace(destination.toString());
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycbzB-0jZIi8drqsNJTSl-U7SCLrpdvEqQdhk-vN-V7TFDXpRan64auSyafezQV5xxeSKtA/exec?admin=1">
  </noscript>
</head>
